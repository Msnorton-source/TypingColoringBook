<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Coloring Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e74c3c;
            --success-color: #2ecc71;
            --info-color: #3498db;
            --neutral-dark: #2c3e50;
            --key-bg: #555555;
            --gold: #f1c40f;
            --bg-soft: #87ceeb;
            /* Sunrise Coral Colors */
            --sunrise-coral: #ffab91; 
            --sunrise-glow: #ffd180;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-soft);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            user-select: none;
            overflow-x: hidden;
            color: var(--neutral-dark);
        }

        h1 { font-family: 'Fredoka One', cursive; color: var(--info-color); font-size: 42px; margin-bottom: 10px; text-shadow: 2px 2px 0px white; }
        p.subtitle { margin: 0 0 30px 0; color: #546e7a; font-size: 20px; font-weight: bold; }

        .app-wrapper {
            width: 100%; max-width: 900px;
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        /* --- SUNRISE HOME SCREEN --- */
        #home-screen {
            display: flex; flex-direction: column; align-items: center;
            /* Changed from white to Sunrise Coral Gradient */
            background: linear-gradient(135deg, var(--sunrise-coral) 0%, var(--sunrise-glow) 100%); 
            padding: 40px; border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%; box-sizing: border-box;
            border: 8px solid white;
        }

        .level-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            margin-top: 20px;
        }

        .level-card {
            background: white; border: 6px solid #cfd8dc; border-radius: 24px;
            padding: 20px; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 8px 0px #cfd8dc;
        }
        .level-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--info-color);
            box-shadow: 0 12px 0px #2980b9;
        }
        .level-card img { 
            width: 100%; height: 180px; object-fit: cover; border-radius: 15px; 
            margin-bottom: 15px; border: 4px solid #f1f8e9; 
        }
        .level-card span { font-family: 'Fredoka One', cursive; font-size: 26px; color: var(--neutral-dark); }

        /* --- GAME UI --- */
        #game-container {
            display: none; flex-direction: column; align-items: center;
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%; border: 6px solid white;
        }
        .game-header-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn {
            padding: 10px 22px; font-size: 16px; font-weight: bold; background: #b0bec5;
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 0px #78909c;
        }
        .back-btn:hover { background: #90a4ae; transform: translateY(2px); box-shadow: 0 2px 0px #78909c; }

        /* --- CANVAS --- */
        #canvas-viewport {
            position: relative; width: 100%; height: auto;
            border: 6px solid var(--neutral-dark);
            border-radius: 15px; overflow: hidden; background: #ffffff;
        }
        .layer-base { position: relative; width: 100%; height: auto; display: block; opacity: 0; pointer-events: none; }
        .color-img, .text-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .color-img { opacity: 0; transform: scale(0.98); transition: opacity 0.4s, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .text-img { opacity: 1; transition: opacity 0.3s; }
        .revealed { opacity: 1 !important; transform: scale(1) !important; }
        .hidden-text { opacity: 0 !important; }
        .z-bg { z-index: 5; } .z-mid { z-index: 10; } .z-fg { z-index: 20; } .z-txt { z-index: 40; }

        /* --- TYPING UI --- */
        #typing-status-box {
            margin: 20px 0; font-size: 28px; font-family: 'Fredoka One', cursive;
            min-height: 50px; background: #eceff1; padding: 10px 40px; border-radius: 50px;
            border: 4px dashed #b0bec5; letter-spacing: 2px; display: flex; justify-content: center; align-items: center;
        }
        #current-buffer { color: var(--primary-color); text-transform: uppercase; }
        #buffer-placeholder { color: #90a4ae; font-size: 16px; font-family: 'Nunito', sans-serif; letter-spacing: 0; }

        #keyboard-panel { background: #37474f; padding: 15px; border-radius: 20px; width: 100%; box-sizing: border-box; }
        .row { display: flex; justify-content: center; gap: 8px; margin-bottom: 5px; }
        .key {
            background: #546e7a; color: white; border-radius: 10px;
            height: 45px; width: 45px; display: flex; align-items: center;
            justify-content: center; font-weight: bold; font-size: 18px; text-transform: uppercase;
            box-shadow: 0 4px 0px #263238;
        }
        .key.hint-target { background: #00838f; border: 2px solid var(--success-color); }
        .key.active-press { background: var(--primary-color) !important; transform: translateY(4px); box-shadow: 0 0px 0px #263238; }

        /* --- MODAL --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
            z-index: 100; padding: 20px; box-sizing: border-box;
        }
        .modal-card {
            background: white; padding: 30px; border-radius: 35px; text-align: center;
            max-width: 800px; width: 100%; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center;
            transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh; overflow-y: auto; scrollbar-width: thin;
        }
        .modal-card h2 { font-family: 'Fredoka One', cursive; color: var(--neutral-dark); font-size: 50px; margin: 0 0 10px 0; }
        .stars-row { display: flex; gap: 20px; margin: 10px 0 20px 0; min-height: 100px; }
        .star { font-size: 90px; color: #e0e0e0; transform: scale(0); transition: color 0.2s; text-shadow: 0 4px 0 #bdbdbd; }
        .star.earned { color: var(--gold); animation: starPop 0.5s forwards; text-shadow: 0 4px 0 #f39c12; }
        .modal-buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 10px; width: 100%; }
        .modal-card button {
            padding: 18px 40px; font-size: 22px; font-family: 'Fredoka One', cursive; border: none; border-radius: 50px; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 10px; color: white;
        }
        .btn-home { background: #90a4ae; box-shadow: 0 6px 0px #546e7a; }
        .btn-replay { background: var(--info-color); box-shadow: 0 6px 0px #2980b9; }
        .btn-next { background: var(--success-color); box-shadow: 0 6px 0px #27ae60; }

        @keyframes starPop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0deg); } }

        /* --- NEW MULTI-DIRECTION CONFETTI --- */
        .confetti { 
            position: absolute; 
            width: 24px; 
            height: 24px; 
            opacity: 0; 
            z-index: 1000;
            pointer-events: none;
        }
        @keyframes confettiUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
        }
        @keyframes confettiDown {
            0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="home-screen">
            <h1>Typing Coloring Book</h1>
            <p class="subtitle">Pick a picture to start typing!</p>
            <div class="level-menu">
                <div class="level-card" onclick="startLevel(1)">
                    <img src="Page 1/Final Image.png" alt="Page 1 Preview">
                    <span>Page 1</span>
                </div>
                <div class="level-card" onclick="startLevel(2)">
                    <img src="Page 2/Final Image.png" alt="Page 2 Preview">
                    <span>Page 2</span>
                </div>
            </div>
        </div>

        <div id="game-container">
            <div class="game-header-bar">
                <button class="back-btn" onclick="goToHome()">🏠 EXIT TO MENU</button>
                <div class="status-badges">
                    <div class="level-badge" id="level-display">Page 1</div>
                    <div class="mistake-tracker" id="mistake-display">Mistakes: 0</div>
                </div>
            </div>

            <div id="canvas-viewport"></div>

            <div id="typing-status-box">
                <span id="buffer-placeholder">Type the words you see on the picture!</span>
                <span id="current-buffer"></span>
            </div>

            <div id="keyboard-panel">
                <div class="row">
                    <div class="key" id="key-Q">q</div><div class="key" id="key-W">w</div><div class="key" id="key-E">e</div><div class="key" id="key-R">r</div><div class="key" id="key-T">t</div>
                    <div class="key" id="key-Y">y</div><div class="key" id="key-U">u</div><div class="key" id="key-I">i</div><div class="key" id="key-O">o</div><div class="key" id="key-P">p</div>
                </div>
                <div class="row">
                    <div class="key" id="key-A">a</div><div class="key" id="key-S">s</div><div class="key" id="key-D">d</div><div class="key" id="key-F">f</div><div class="key" id="key-G">g</div>
                    <div class="key" id="key-H">h</div><div class="key" id="key-J">j</div><div class="key" id="key-K">k</div><div class="key" id="key-L">l</div>
                </div>
                <div class="row">
                    <div class="key" id="key-Z">z</div><div class="key" id="key-X">x</div><div class="key" id="key-C">c</div><div class="key" id="key-V">v</div><div class="key" id="key-B">b</div>
                    <div class="key" id="key-N">n</div><div class="key" id="key-M">m</div>
                </div>
            </div>
        </div>
    </div>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-card" id="v-card">
            <h2>Hooray!</h2>
            <div class="stars-row" id="stars-box">
                <span class="star">★</span><span class="star">★</span><span class="star">★</span>
            </div>
            <img id="victory-image" src="" alt="Winner" style="width:100%; border-radius: 20px; border: 5px solid #f1f8e9; margin-bottom: 20px;">
            <div class="modal-buttons">
                <button class="btn-home" onclick="goToHome()">🏠 MENU</button>
                <button class="btn-replay" onclick="replayLevel()">🔄 AGAIN</button>
                <button class="btn-next" id="next-level-btn" onclick="playNextLevel()">➡️ NEXT</button>
            </div>
        </div>
    </div>

    <script>
        const levelsConfiguration = {
            1: {
                folder: "Page 1/",
                preview: "Final Image.png",
                words: {
                    "SKY":    { file: "1Sky.png",    tier: "z-bg" },
                    "CLOUDS": { file: "2Clouds.png", tier: "z-bg" },
                    "GRASS":  { file: "3Grass.png",  tier: "z-bg" },
                    "SUN":    { file: "4Sun.png",    tier: "z-bg" },
                    "POND":   { file: "5Pond.png",   tier: "z-bg" },
                    "DUCKS":  { file: "6Ducks.png",  tier: "z-fg" },
                    "MUD":    { file: "7Mud.png",    tier: "z-bg" },
                    "PIG":    { file: "8Pig.png",    tier: "z-fg" },
                    "BARN":   { file: "9Barn.png",   tier: "z-mid" },
                    "COW":    { file: "10Cow.png",   tier: "z-fg" },
                    "DOG":    { file: "11Dog.png",   tier: "z-fg" },
                    "FARMER": { file: "12Farmer.png",tier: "z-fg" },
                    "HEN":    { file: "13Hen.png",   tier: "z-fg" },
                    "TREE":   { file: "14Tree.png",  tier: "z-mid" }
                }
            },
            2: {
                folder: "Page 2/",
                preview: "Final Image.png",
                words: {
                    "SKY":     { file: "1Sky.png",    tier: "z-bg" },
                    "CLOUDS":  { file: "2Clouds.png", tier: "z-bg" },
                    "FIELD":   { file: "3Field.png",  tier: "z-bg" },
                    "BIRD":    { file: "4Bird.png",   tier: "z-fg" },
                    "SUN":     { file: "5Sun.png",    tier: "z-bg" },
                    "TREE":    { file: "6Tree.png",   tier: "z-mid" },
                    "APPLES":  { file: "7Apples.png", tier: "z-fg" },
                    "BARN":    { file: "8Barn.png",   tier: "z-mid" },
                    "HORSE":   { file: "9Horse.png",  tier: "z-fg" },
                    "GOATS":   { file: "10Goats.png", tier: "z-fg" },
                    "SHEEP":   { file: "11Sheep.png", tier: "z-fg" },
                    "TRACTOR": { file: "12Tractor.png",tier:"z-fg" },
                    "CORN":    { file: "13Corn.png",  tier: "z-fg" },
                    "DONKEY":  { file: "14Donkey.png",tier: "z-fg" },
                    "WORMS":   { file: "15Worms.png", tier: "z-fg" },
                    "BOY":     { file: "16Boy.png",   tier: "z-fg" }
                }
            }
        };

        let currentLevel = 1;
        let activeWordsList = [];
        let revealedWords = new Set();
        let typedBuffer = "";
        let gameActive = false;
        let totalMistakes = 0;
        let audioCtx = null;

        function initAudioEngine() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playErrorBloop() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(130, now + 0.12);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.12);
        }

        function playWordSound(wordKey) {
            // 1. Format the word (e.g., "COW" becomes "Cow")
            let formattedFileName = wordKey.charAt(0).toUpperCase() + wordKey.slice(1).toLowerCase();
            
            // 2. Create the spoken word audio
            let spokenAudio = new Audio(`Sounds/${formattedFileName}.mp3`);
            
            // 3. Tell the engine what to do WHEN the spoken word FINISHES
            spokenAudio.onended = function() {
                // Try to load the secondary sound (e.g., "Cow2.mp3")
                let effectAudio = new Audio(`Sounds/${formattedFileName}2.mp3`);
                
                // Try to play it
                effectAudio.play().catch(() => {
                    // IF it fails (meaning the file doesn't exist), play the fallback!
                    let randomNum = Math.floor(Math.random() * 2) + 1; // Picks 1 or 2
                    let fallbackAudioName = randomNum === 1 ? 'Correct.mp3' : 'Correct2.mp3';
                    
                    let fallbackAudio = new Audio(`Sounds/${fallbackAudioName}`);
                    fallbackAudio.play().catch(err => console.log("Missing fallback audio: " + fallbackAudioName));
                });
            };
            
            // 4. Play the spoken word to kick off the chain!
            spokenAudio.play().catch(err => console.log(`Missing sound: ${formattedFileName}.mp3`));
        }

        function startLevel(lvlNum) {
            initAudioEngine();
            currentLevel = lvlNum;
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('level-display').innerText = `Page ${lvlNum}`;
            totalMistakes = 0;
            document.getElementById('mistake-display').innerText = "Mistakes: 0";
            revealedWords.clear();
            typedBuffer = "";
            const config = levelsConfiguration[lvlNum];
            activeWordsList = Object.keys(config.words);
            const viewport = document.getElementById('canvas-viewport');
            let DOMString = `<img class="layer-base" src="${config.folder}Original.png">`;
            activeWordsList.forEach(wordKey => {
                let item = config.words[wordKey];
                DOMString += `<img id="layer-${wordKey}" class="color-img ${item.tier}" src="${config.folder}${item.file}">`;
                DOMString += `<img id="text-${wordKey}" class="text-img z-txt" src="${config.folder}Text ${item.file}">`;
            });
            viewport.innerHTML = DOMString;
            document.getElementById('victory-image').src = config.folder + config.preview;
            const nextBtn = document.getElementById('next-level-btn');
            nextBtn.style.display = levelsConfiguration[currentLevel + 1] ? "inline-flex" : "none";
            gameActive = true;
            updateKeyboardHints();
        }

        function replayLevel() { closeModal(); setTimeout(() => startLevel(currentLevel), 400); }
        function playNextLevel() { closeModal(); setTimeout(() => startLevel(currentLevel + 1), 400); }
        function goToHome() { gameActive = false; closeModal(); setTimeout(() => { document.getElementById('game-container').style.display = 'none'; document.getElementById('home-screen').style.display = 'flex'; }, 400); }
        function closeModal() { const modal = document.getElementById("victory-modal"); modal.style.opacity = "0"; document.getElementById('v-card').style.transform = "scale(0.8)"; setTimeout(() => { modal.style.display = "none"; }, 400); }

        function updateKeyboardHints() {
            if (!gameActive) return;
            document.querySelectorAll('.key').forEach(k => { k.classList.remove('hint-target', 'active-press'); });
            let expectedNextChars = new Set();
            activeWordsList.forEach(word => {
                if (revealedWords.has(word)) return; 
                if (typedBuffer === "") expectedNextChars.add(word[0]);
                else if (word.startsWith(typedBuffer) && word !== typedBuffer) expectedNextChars.add(word[typedBuffer.length]);
            });
            expectedNextChars.forEach(char => { document.getElementById(`key-${char}`)?.classList.add('hint-target'); });
            document.getElementById("buffer-placeholder").style.display = typedBuffer === "" ? "inline" : "none";
            document.getElementById("current-buffer").innerText = typedBuffer;
        }

        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'Backspace') { if (typedBuffer.length > 0) typedBuffer = typedBuffer.slice(0, -1); updateKeyboardHints(); return; }
            let key = e.key.toUpperCase();
            if (!/^[A-Z]$/.test(key)) return; 
            document.getElementById(`key-${key}`)?.classList.add('active-press');
            setTimeout(() => document.getElementById(`key-${key}`)?.classList.remove('active-press'), 120);
            let potentialBuffer = typedBuffer + key;
            if (activeWordsList.some(word => !revealedWords.has(word) && word.startsWith(potentialBuffer))) {
                typedBuffer = potentialBuffer;
            } else if (activeWordsList.some(word => !revealedWords.has(word) && word.startsWith(key))) {
                typedBuffer = key;
            } else {
                typedBuffer = ""; totalMistakes++;
                document.getElementById('mistake-display').innerText = `Mistakes: ${totalMistakes}`;
                playErrorBloop();
            }
            if (activeWordsList.includes(typedBuffer) && !revealedWords.has(typedBuffer)) {
                revealedWords.add(typedBuffer);
                document.getElementById(`layer-${typedBuffer}`)?.classList.add('revealed');
                document.getElementById(`text-${typedBuffer}`)?.classList.add('hidden-text');
                playWordSound(typedBuffer);
                typedBuffer = ""; 
                if (revealedWords.size === activeWordsList.length) handleWin();
            }
            updateKeyboardHints();
        });

        function handleWin() {
            gameActive = false;
            
            // CONFETTI STORM GENERATOR
            for (let i = 0; i < 40; i++) {
                createConfetti('up');
                createConfetti('down');
            }

            setTimeout(() => {
                const modal = document.getElementById("victory-modal");
                modal.style.display = "flex";
                setTimeout(() => { modal.style.opacity = "1"; document.getElementById('v-card').style.transform = "scale(1)"; awardStars(); }, 50);
            }, 600);
        }

        function createConfetti(dir) {
            const colors = ['#f1c40f','#e74c3c','#3498db','#2ecc71','#9b59b6','#ff85a2'];
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + "vw";
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            // Set direction animation
            c.style.animationName = (dir === 'up') ? 'confettiUp' : 'confettiDown';
            
            // Randomize speed and delay
            c.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
            c.style.animationDelay = (Math.random() * 0.5) + "s";
            
            // Randomize size slightly
            const size = (Math.random() * 15 + 15) + "px";
            c.style.width = size;
            c.style.height = size;

            document.body.appendChild(c);
            setTimeout(() => c.remove(), 4000);
        }

        function awardStars() {
            const stars = document.querySelectorAll('.star');
            stars.forEach(s => s.classList.remove('earned'));
            let count = (totalMistakes <= 10) ? 3 : (totalMistakes <= 25 ? 2 : 1);
            for (let i = 0; i < count; i++) {
                setTimeout(() => { 
                    stars[i].classList.add('earned'); 
                    if (i === count - 1) {
                        const winPhrases = ["Great Job.mp3", "Wonderful.mp3", "Nice Work.mp3", "Amazing.mp3"];
                        const randomPhrase = winPhrases[Math.floor(Math.random() * winPhrases.length)];
                        new Audio(`Sounds/${randomPhrase}`).play();
                    }
                }, 350 * (i + 1));
            }
        }
    </script>
</body>
</html>
